services:
  app:
    build: .
    container_name: bus-kalender
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET muss in der .env-Datei gesetzt sein}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
